version: '3.8'

# Production stack: bot + Ollama on one server (no ngrok, no Mac).
# 1. cp .env.example .env — fill BOT_TOKEN, Supabase, etc.
# 2. docker compose up -d --build
# 3. docker compose exec ollama ollama pull llama3.2

services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - '11434:11434'

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_AUTO_ACTIVATE: 'true'
      OLLAMA_MODEL: llama3.2
    depends_on:
      - ollama
    ports:
      - '8080:8080'
    volumes:
      - ./storage:/app/storage

volumes:
  ollama_data:
